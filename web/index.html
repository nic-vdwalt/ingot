<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ingot - WebGPU (Odin)</title>
	<style>
		html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd;
			font-family: ui-monospace, monospace; }
		#wrap { display: flex; flex-direction: column; align-items: center; gap: 12px;
			padding: 24px; box-sizing: border-box; height: 100%; }
		#ingot-canvas { width: 1280px; max-width: 92vw; height: 720px; max-height: 78vh;
			border: 1px solid #46464f; border-radius: 8px; background: #000;
			outline: none; touch-action: none; }
		#msg { font-size: 13px; color: #a0a0aa; }
		#crash { display: none; font-size: 12px; color: #ff8080; background: #2a1e1e;
			border: 1px solid #5a3030; border-radius: 6px; padding: 8px 10px;
			max-width: 92vw; max-height: 30vh; overflow: auto; white-space: pre-wrap;
			word-break: break-word; margin: 0; }
		a { color: #64a0ff; }
	</style>
</head>
<body>
	<div id="wrap">
		<h3>ingot on WebGPU - Odin → WASM</h3>
		<!-- tabindex makes the canvas focusable so it receives keyboard events -->
		<canvas id="ingot-canvas" width="1280" height="720" tabindex="0"></canvas>
		<div id="msg">initializing…</div>
		<pre id="crash"></pre>
	</div>

	<!-- On-device crash reporting. Loaded first so it captures everything the
	     runtimes log during boot; see ingot_crash.js for why. -->
	<script src="ingot_crash.js"></script>

	<!-- Odin JS runtime + vendor:wgpu browser glue (staged by build_web.sh). -->
	<script src="odin.js"></script>
	<script src="wgpu.js"></script>
	<!-- ingot host glue: "ingot" import module, canvas sizing, boot. -->
	<script src="ingot_input.js"></script>
	<script src="ingot_web.js"></script>
	<script>
		const msg = document.getElementById("msg");
		window.ingotWeb.run("ingot_web.wasm")
			.then(() => {
				// A previous session's post-mortem renders into #crash and
				// must not suppress this session's status line.
				if (window.ingotCrash.crashed()) return;
				msg.textContent = "running (WebGPU)";
			})
			.catch((error) => {
				// Route through the reporter so the panel shows this alongside
				// the engine's own log lines instead of replacing them.
				window.ingotCrash.report(error && error.message || error);
				console.error(error);
			});
	</script>
</body>
</html>
