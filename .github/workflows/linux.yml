name: Linux gates

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            python3 \
            libcurl4-openssl-dev \
            libvulkan-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev
      - name: Install pinned Odin toolchain
        run: |
          git init "$RUNNER_TEMP/odin"
          git -C "$RUNNER_TEMP/odin" remote add origin https://github.com/odin-lang/Odin
          git -C "$RUNNER_TEMP/odin" fetch --depth=1 origin 285f6d87bc86b17329fb23416fd512da4393885b
          git -C "$RUNNER_TEMP/odin" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/odin" config core.abbrev 9
          cd "$RUNNER_TEMP/odin"
          ./build_odin.sh release
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: Verify pinned Odin toolchain
        run: python3 scripts/check-toolchain.py
      - name: Run Linux native gate
        run: bash scripts/check-linux.sh
