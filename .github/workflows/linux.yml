name: Linux gates

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            python3 \
            libcurl4-openssl-dev \
            libvulkan-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev
      - name: Install pinned Odin toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/odin"
          gh api repos/odin-lang/Odin/releases/assets/443563911 \
            -H "Accept: application/octet-stream" > "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          git init "$RUNNER_TEMP/odin-source"
          git -C "$RUNNER_TEMP/odin-source" remote add origin https://github.com/odin-lang/Odin
          git -C "$RUNNER_TEMP/odin-source" fetch --depth=1 origin 285f6d87bc86b17329fb23416fd512da4393885b
          git -C "$RUNNER_TEMP/odin-source" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/odin-source" config core.abbrev 9
          cd "$RUNNER_TEMP/odin-source"
          ./build_odin.sh release
          cp odin "$RUNNER_TEMP/odin/odin"
          gh api repos/DanielGavin/ols/releases/assets/487668598 \
            -H "Accept: application/octet-stream" > "$RUNNER_TEMP/ols.zip"
          unzip -q "$RUNNER_TEMP/ols.zip" -d "$RUNNER_TEMP/ols"
          mv "$RUNNER_TEMP/ols/odinfmt-x86_64-unknown-linux-gnu" "$RUNNER_TEMP/ols/odinfmt"
          gh api repos/gfx-rs/wgpu-native/releases/assets/392896163 \
            -H "Accept: application/octet-stream" > "$RUNNER_TEMP/wgpu.zip"
          mkdir "$RUNNER_TEMP/odin/vendor/wgpu/lib/wgpu-linux-x86_64-release"
          unzip -q "$RUNNER_TEMP/wgpu.zip" -d "$RUNNER_TEMP/odin/vendor/wgpu/lib/wgpu-linux-x86_64-release"
          make -C "$RUNNER_TEMP/odin/vendor/miniaudio/src"
          make -C "$RUNNER_TEMP/odin/vendor/stb/src"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ols" >> "$GITHUB_PATH"
      - name: Verify pinned Odin toolchain
        run: python3 scripts/check-toolchain.py
      - name: Run Linux native gate
        run: bash scripts/check-linux.sh
