name: macOS gates

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Upstream Odin commit behind ODIN_VERSION (dev-2026-10:93f71c2). Change both together.
  ODIN_COMMIT: 93f71c2751f0f8cb1d2a7a892ae4505f9af6d13d
  ODIN_RELEASE_ASSET: 615726666
  OLS_ASSET: 487668580
  WGPU_ASSET: 455571728

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded failure logs
        run: echo "INGOT_TEST_FAILURE_LOG_DIR=$RUNNER_TEMP/ingot-test-failures" >> "$GITHUB_ENV"
      - name: Verify macOS architecture
        run: |
          [ "$(uname -m)" = arm64 ] || {
            echo "macOS arm64 is required for the pinned native libraries" >&2
            exit 1
          }
          test -f accesskit/lib/darwin_arm64/libaccesskit.a
          test -f libvterm/lib/darwin_arm64/libvterm.a
      - name: Install SDL3
        run: brew install sdl3
      - name: Restore pinned Odin toolchain
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/odin
            ${{ runner.temp }}/ols
          key: odin-${{ runner.os }}-${{ env.ODIN_COMMIT }}-${{ env.ODIN_RELEASE_ASSET }}-${{ env.OLS_ASSET }}-${{ env.WGPU_ASSET }}-v1
      - name: Build pinned Odin toolchain
        if: steps.odin-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # fetch_gh <api path> <out> [accept]: release assets need the
          # octet-stream Accept header; tarball endpoints reject it (HTTP 415),
          # so callers pass "" to omit it.
          fetch_gh() {
            accept="${3-application/octet-stream}"
            attempt=1
            while :; do
              if [ -n "$accept" ]; then
                gh api "$1" -H "Accept: $accept" > "$2" && return 0
              else
                gh api "$1" > "$2" && return 0
              fi
              if [ "$attempt" -ge 5 ]; then
                echo "download failed after $attempt attempts: $1" >&2
                return 1
              fi
              echo "download attempt $attempt failed, retrying: $1" >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }
          mkdir "$RUNNER_TEMP/odin" "$RUNNER_TEMP/ols" "$RUNNER_TEMP/wgpu"
          fetch_gh "repos/odin-lang/Odin/releases/assets/$ODIN_RELEASE_ASSET" "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          fetch_gh "repos/DanielGavin/ols/releases/assets/$OLS_ASSET" "$RUNNER_TEMP/ols.zip"
          unzip -q "$RUNNER_TEMP/ols.zip" -d "$RUNNER_TEMP/ols"
          mv "$RUNNER_TEMP/ols/odinfmt-arm64-darwin" "$RUNNER_TEMP/ols/odinfmt"
          chmod +x "$RUNNER_TEMP/ols/odinfmt"
          fetch_gh "repos/gfx-rs/wgpu-native/releases/assets/$WGPU_ASSET" "$RUNNER_TEMP/wgpu.zip"
          unzip -q "$RUNNER_TEMP/wgpu.zip" -d "$RUNNER_TEMP/wgpu"
          mkdir -p "$RUNNER_TEMP/odin/vendor/wgpu/lib/wgpu-macos-aarch64-release/lib"
          cp "$RUNNER_TEMP/wgpu/lib/"* \
            "$RUNNER_TEMP/odin/vendor/wgpu/lib/wgpu-macos-aarch64-release/lib/"
          fetch_gh "repos/odin-lang/Odin/tarball/$ODIN_COMMIT" "$RUNNER_TEMP/odin-source.tar.gz" ""
          tar -xzf "$RUNNER_TEMP/odin-source.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          brew install llvm@20
          (cd "$RUNNER_TEMP/odin" && git init && git fetch --depth=1 https://github.com/odin-lang/Odin "$ODIN_COMMIT" && git reset FETCH_HEAD && LLVM_CONFIG="$(brew --prefix llvm@20)/bin/llvm-config" sh build_odin.sh release)
          sh "$RUNNER_TEMP/odin/vendor/miniaudio/src/build_miniaudio.sh"
          sh "$RUNNER_TEMP/odin/vendor/stb/src/build_stb.sh" unix
      - name: Expose pinned Odin toolchain
        run: |
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ols" >> "$GITHUB_PATH"
      - name: Verify pinned macOS toolchain
        run: |
          python3 scripts/check-toolchain.py
          odinfmt -help >/dev/null
          python3 scripts/check-repository-hygiene.py
      - name: Run macOS native tests
        run: bash scripts/test.sh -define:ODIN_TEST_THREADS=1
      - name: Run macOS strict gate
        run: bash scripts/check.sh
      - name: Run macOS SDL3 tests
        run: bash scripts/test.sh -define:ODIN_TEST_THREADS=1 -define:INGOT_GFX_SDL3=true
      - name: Run macOS SDL3 strict gate
        run: bash scripts/check.sh -define:INGOT_GFX_SDL3=true
      - name: Upload bounded failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-failures
          path: ${{ runner.temp }}/ingot-test-failures
          if-no-files-found: ignore
          retention-days: 7
