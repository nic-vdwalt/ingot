name: Windows gates

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Upstream Odin commit behind ODIN_VERSION (dev-2026-10:93f71c2). Change both together.
  ODIN_COMMIT: 93f71c2751f0f8cb1d2a7a892ae4505f9af6d13d
  ODIN_RELEASE_ASSET: 615725640
  OLS_ASSET: 487668593
  WGPU_ASSET: 455571718

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded failure logs
        shell: pwsh
        run: |
          "INGOT_TEST_FAILURE_LOG_DIR=$env:RUNNER_TEMP/ingot-test-failures" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install SDL3
        shell: pwsh
        run: |
          vcpkg install sdl3:x64-windows
          $SdlRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows"
          "LIB=$SdlRoot/lib;$env:LIB" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$SdlRoot/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore pinned Odin toolchain
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/odin
            ${{ runner.temp }}/ols
          key: odin-${{ runner.os }}-${{ env.ODIN_COMMIT }}-${{ env.ODIN_RELEASE_ASSET }}-${{ env.OLS_ASSET }}-${{ env.WGPU_ASSET }}-v1
      - name: Build pinned Odin toolchain
        if: steps.odin-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $OdinArchive = Join-Path $env:RUNNER_TEMP "odin.zip"
          $OlsArchive = Join-Path $env:RUNNER_TEMP "ols.zip"
          $WgpuArchive = Join-Path $env:RUNNER_TEMP "wgpu.zip"
          $OdinRoot = Join-Path $env:RUNNER_TEMP "odin"
          $OlsRoot = Join-Path $env:RUNNER_TEMP "ols"
          $WgpuRoot = Join-Path $env:RUNNER_TEMP "wgpu"
          New-Item -ItemType Directory -Force -Path $OdinRoot, $OlsRoot, $WgpuRoot | Out-Null
          gh api "repos/odin-lang/Odin/releases/assets/$env:ODIN_RELEASE_ASSET" `
            -H "Accept: application/octet-stream" > $OdinArchive
          gh api "repos/DanielGavin/ols/releases/assets/$env:OLS_ASSET" `
            -H "Accept: application/octet-stream" > $OlsArchive
          gh api "repos/gfx-rs/wgpu-native/releases/assets/$env:WGPU_ASSET" `
            -H "Accept: application/octet-stream" > $WgpuArchive
          Expand-Archive -Path $OdinArchive -DestinationPath $OdinRoot
          Expand-Archive -Path $OlsArchive -DestinationPath $OlsRoot
          Expand-Archive -Path $WgpuArchive -DestinationPath $WgpuRoot
          $OdinRoot = Join-Path $OdinRoot "dist"
          $SourceArchive = Join-Path $env:RUNNER_TEMP "odin-source.tar.gz"
          gh api "repos/odin-lang/Odin/tarball/$env:ODIN_COMMIT" > $SourceArchive
          tar -xzf $SourceArchive -C $OdinRoot --strip-components=1
          Push-Location $OdinRoot
          git init
          git fetch --depth=1 https://github.com/odin-lang/Odin $env:ODIN_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Odin source fetch failed" }
          git reset FETCH_HEAD
          cmd /c build.bat release
          if ($LASTEXITCODE -ne 0) { throw "Odin compiler build failed" }
          Pop-Location
          $WgpuTarget = Join-Path $OdinRoot "vendor/wgpu/lib/wgpu-windows-x86_64-msvc-release/lib"
          New-Item -ItemType Directory -Force -Path $WgpuTarget | Out-Null
          Copy-Item -Force (Join-Path $WgpuRoot "lib/*") $WgpuTarget
          Move-Item `
            (Join-Path $OlsRoot "odinfmt-x86_64-pc-windows-msvc.exe") `
            (Join-Path $OlsRoot "odinfmt.exe")
      - name: Expose pinned Odin toolchain
        shell: pwsh
        run: |
          (Join-Path $env:RUNNER_TEMP "odin/dist") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:RUNNER_TEMP "ols") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pinned Windows toolchain
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem) {
            throw "Windows x64 is required for committed native libraries"
          }
          foreach ($Command in @("python", "odin", "odinfmt", "cl", "link")) {
            if (-not (Get-Command $Command -ErrorAction SilentlyContinue)) {
              throw "$Command is required"
            }
          }
          foreach ($Library in @(
            "accesskit/lib/windows_amd64/accesskit.lib",
            "libvterm/lib/windows_amd64/vterm.lib"
          )) {
            if (-not (Test-Path $Library)) {
              throw "Missing native library: $Library"
            }
          }
          python scripts/check-toolchain.py
          odinfmt -help | Out-Null
      - name: Run Windows strict gate
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Run Windows SDL3 strict gate
        shell: pwsh
        run: ./scripts/check.ps1 -OdinFlags '-define:INGOT_GFX_SDL3=true'
      # The committed libvterm/lib/windows_amd64/vterm.lib predates the
      # erase_internal and putglyph patches (docs/provenance/third-party-artifacts.json
      # marks it stale), so tests need a rebuilt archive. The strict gates above
      # run first because scripts/check-repository-hygiene.py compares that file
      # against its recorded checksum and MSVC lib.exe output is not reproducible;
      # rebuilding after the gates lets one archive serve both test passes with no
      # restore step. See THIRD_PARTY_NOTICES.md for replacing the committed file.
      - name: Rebuild patched Windows libvterm
        shell: pwsh
        run: cmd /c scripts\build-libvterm.bat
      - name: Publish patched Windows libvterm
        shell: pwsh
        run: |
          $lib = 'libvterm/lib/windows_amd64/vterm.lib'
          $hash = (Get-FileHash -Algorithm SHA256 $lib).Hash.ToLower()
          "$hash  $lib" | Set-Content -NoNewline -Encoding ascii "$lib.sha256"
          Write-Host "$hash  $lib"
      - name: Upload patched Windows libvterm
        uses: actions/upload-artifact@v4
        with:
          name: windows-libvterm-patched
          path: |
            libvterm/lib/windows_amd64/vterm.lib
            libvterm/lib/windows_amd64/vterm.lib.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Run Windows native tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Run Windows SDL3 tests
        shell: pwsh
        run: ./scripts/test.ps1 -OdinFlags '-define:INGOT_GFX_SDL3=true'
      - name: Upload bounded failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-failures
          path: ${{ runner.temp }}/ingot-test-failures
          if-no-files-found: ignore
          retention-days: 7
